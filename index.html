const claim=i=>{if(win<0){win=i;clearTimeout(hg);try{cs[1-i].abort()}catch(e){}}return win==i};
function go(i){if(i==1){if(st1||done)return;st1=1}
fetch(U,{method:'POST',headers:H,signal:cs[i].signal,body:JSON.stringify({model:MD[i],messages:msgs,stream:true})}).then(async r=>{
if(!r.ok)throw 0;
if(!r.body||!r.body.getReader||!/event-stream/.test(r.headers.get('content-type')||'')){const tx=await r.text();let c=tx;try{const j=JSON.parse(tx);c=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:''}catch(e){}if(bad(c))throw 0;if(claim(i)){acc[i]=c;if(onText)try{onText(c)}catch(e){}fin(c)}return}
const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
for(;;){const q=await rd.read();if(q.done)break;buf+=dc.decode(q.value,{stream:true});let k;
while((k=buf.indexOf('\n'))>=0){const ln=buf.slice(0,k).trim();buf=buf.slice(k+1);if(ln.indexOf('data:')!==0)continue;const pl=ln.slice(5).trim();if(pl=='[DONE]')continue;
let j;try{j=JSON.parse(pl)}catch(e){continue}
const dl=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(!dl)continue;
if(!claim(i))return;acc[i]+=dl;if(onText)try{onText(acc[i])}catch(e){}}}

go(0);hg=setTimeout(()=>go(1),3500)})}
